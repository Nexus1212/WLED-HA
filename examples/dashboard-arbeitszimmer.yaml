# Dashboard → Bearbeiten → Karte hinzufügen → Manuell: gesamten Inhalt einfügen.
# Benötigt Browser Mod und Light Entity Card (beide über HACS).
type: tile
entity: light.wled_2_segment_1
name: Arbeitszimmer EG
icon: mdi:led-strip-variant
vertical: false
icon_tap_action:
  action: toggle
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Arbeitszimmer EG
      content:
        type: vertical-stack
        cards:
          - type: custom:light-entity-card
            entity: light.wled_2_segment_1
            header: Licht
            persist_features: true
            brightness: true
            color_picker: true
            color_temp: false
            white_value: false
            speed: false
            intensity: false
          - type: entities
            title: Effekteinstellungen
            show_header_toggle: false
            entities:
              - entity: number.wled_2_segment_1_geschwindigkeit
                name: Geschwindigkeit
                icon: mdi:speedometer
              - entity: number.wled_2_segment_1_intensitat
                name: Intensität
                icon: mdi:tune
              - entity: select.wled_2_segment_1_farbpalette
                name: Farbpalette
                icon: mdi:palette
