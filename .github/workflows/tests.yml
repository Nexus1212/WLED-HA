name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Behavior and adapter tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node-RED example
        run: node tests/test-node-red.js
